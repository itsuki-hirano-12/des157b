<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <script src="https://kit.fontawesome.com/dea98f1693.js" crossorigin="anonymous"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krub:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <link href="styles.css" rel="stylesheet">

    

    <script type="text/javascript" src="https://unpkg.com/parse/dist/parse.min.js"></script>

    <script src="macy.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/SplitText.min.js"></script>

    <script src="script.js" defer></script>

    <title>Library Liberty</title>
</head>
<body>
    <div id="container">
        <nav>
            

            <div id="controls">
                <div id="auto" class="active"><i class="fa-solid fa-play"></i></div>
                <div id="en">EN</div>
                <div id="world"><i class="fa-solid fa-globe"></i></div>
            </div>
        </nav>
        

        <div id="words" class="anyLang">
        </div>


        <!-- class="display-form" -->
        <div id="newWord" class="hide-form">
            <p>Add a new word</p>

            <i class="fa-solid fa-angle-down" id="close"></i>

            <form id="send-word" >

                <div id="inputs">
                    <div class="item">
                        <label for="new-word">Add a word in any language</label>
                        <input type="text" id="new-word" name="newword">
                    </div>
                    
                    <div class="item">
                        <label for="translation">Add English translation for the word</label>
                        <input type="text" id="translation" name="translation">
                    </div>  
                </div>
                    
                <input type="submit" value="send" id="send">
            </form>   
        </div>

        <footer>
            <p>Libraries Used</p>
            <ul>
                <li><a href="https://www.back4app.com/">Back4App</a></li>
                <li><a href="http://macyjs.com/">Macy.js</a></li>
                <li><a href="https://gsap.com/">GSAP</a></li>
            </ul>
        </footer>
    </div>
</body>
</html>
